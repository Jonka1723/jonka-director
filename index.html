<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JonKa Director</title>
<meta name="theme-color" content="#0F2348">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Director">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--navy:#0F2348;--gold:#D4BE8E;--cream:#F7F3EA;--muted:#B9B3A4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:var(--cream);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);text-align:center}
img{width:min(220px,60vw);height:auto}
h1{font:600 26px Georgia,"Times New Roman",serif;color:var(--gold);margin:0}
p{margin:0;color:var(--muted);max-width:32ch}
a.go{display:inline-block;background:var(--gold);color:var(--navy);text-decoration:none;font-weight:600;
  padding:14px 28px;border-radius:999px;min-width:220px}
a.go:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.how{font-size:13px}
</style>
</head>
<body>
<img src="icon-512.png" alt="JonKa">
<h1>Director de IA</h1>
<p id="msg">Tu pantalla privada vive en Claude. Ábrela con tu sesión.</p>
<a class="go" id="go" href="https://claude.ai/artifact/KzLHd3Dc4iviEREhRozcWo">Abrir Director</a>
<p class="how" id="how">Para instalarla: en Android, menú ⋮ › «Agregar a pantalla principal». En iPhone, Safari › Compartir › «Agregar a inicio».</p>
<script>
// Al abrir desde el ícono instalado, entra directo a la pantalla en Claude.
var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (standalone) {
  document.getElementById('how').hidden = true;
  document.getElementById('msg').textContent = 'Abriendo tu pantalla…';
  location.replace(document.getElementById('go').href);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
